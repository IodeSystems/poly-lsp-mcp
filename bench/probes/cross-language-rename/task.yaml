name: cross-language-rename
class: tooluse
description: |
  ## What this measures

  The same logical field under three different spellings, in three languages,
  renamed consistently in one pass:

  | File | Before | After |
  |---|---|---|
  | `model.go` (Go identifier) | `LegacyID` | `ArchivedID` |
  | `model.go` (JSON tag) | `legacy_id` | `archived_id` |
  | `client.ts` (TypeScript) | `legacyId` | `archivedId` |
  | `config.yaml` (YAML key) | `legacy_id` | `archived_id` |

  Each has to end up in its own language's casing, so this is not a
  find-and-replace of one string — it is four coordinated edits that a model has
  to recognise as the same field.

  ## Why it is hard without cross-language addressing

  Nothing links the four representations textually. Searching for any one
  spelling finds only its own file, so the model has to know the mapping exists
  and go looking. The characteristic failure is getting three of four and missing
  a casing — usually the JSON tag, which sits inside the Go file the model
  already edited and reads as part of a line it thinks it has handled.

  ## Reading a failure

  Every file is checked in both directions: new name present AND old name absent
  (negations run via `sh -c`). A file passing "present" but failing "absent"
  means the model added the new spelling without removing the old — a
  half-applied rename that would leave both fields live.
workspace: _fixture/
# Favors poly-lsp: the SAME logical field appears in three languages with
# language-appropriate casing — Go `LegacyID` (+ json tag `legacy_id`),
# TypeScript `legacyId`, YAML `legacy_id`. poly-lsp's cross-language node
# addressing links the representations; baseline must hunt each file by hand and
# tends to miss one casing. Checks assert new names present AND old names gone in
# every file (! negation runs via `sh -c`).
limits: { maxTurnsPerStage: 12, maxToolCallsPerStage: 30 }
stages:
  - prompt: |
      The field currently spelled `legacy_id` / `LegacyID` / `legacyId` is being
      renamed to `archived_id` / `ArchivedID` / `archivedId`. Update ALL of its
      representations so the Go struct (model.go, including its JSON tag), the
      TypeScript interface (client.ts), and the config (config.yaml) stay
      consistent, each using its language's casing.
    checks:
      # model.go: Go identifier + JSON tag renamed, old forms gone.
      - cmd_ok: "grep -q ArchivedID model.go"
      - cmd_ok: "grep -q archived_id model.go"
      - cmd_ok: "! grep -q LegacyID model.go"
      - cmd_ok: "! grep -q legacy_id model.go"
      # client.ts: camelCase renamed, old form gone.
      - cmd_ok: "grep -q archivedId client.ts"
      - cmd_ok: "! grep -q legacyId client.ts"
      # config.yaml: snake_case renamed, old form gone.
      - cmd_ok: "grep -q archived_id config.yaml"
      - cmd_ok: "! grep -q legacy_id config.yaml"
